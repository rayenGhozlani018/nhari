plugins {
    id "com.android.application"
}

android {
    namespace "com.rayen.nhari"
    compileSdk 34

    defaultConfig {
        applicationId "com.rayen.nhari"
        minSdk 26
        targetSdk 34
        versionCode Integer.parseInt((project.findProperty("vc") ?: "1").toString())
        versionName "1.0." + (project.findProperty("vc") ?: "1").toString()
    }

    // The signing key is in the repo only encrypted (nhari.jks.enc). The build machine decrypts it with the
    // NHARI_KS_PASS secret; without it the release APK is built unsigned (to check the code) and not published.
    def ksPass = System.getenv("NHARI_KS_PASS")
    def ksFile = file("nhari.jks")
    def canSign = ksPass && ksFile.exists()

    signingConfigs {
        nhari {
            if (canSign) {
                storeFile ksFile
                storePassword ksPass
                keyAlias "nhari"
                keyPassword ksPass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (canSign) signingConfig signingConfigs.nhari
        }
    }

    buildFeatures { buildConfig true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
