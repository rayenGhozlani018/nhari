plugins {
    id "com.android.application"
}

android {
    namespace "com.rayen.nhari"
    compileSdk 34

    defaultConfig {
        applicationId "com.rayen.nhari"
        minSdk 26
        targetSdk 34
        versionCode Integer.parseInt((project.findProperty("vc") ?: "1").toString())
        versionName "1.0." + (project.findProperty("vc") ?: "1").toString()
    }

    signingConfigs {
        // personal sideloaded app: the key lives in the repo so every build can update the installed app
        nhari {
            storeFile file("nhari.jks")
            storePassword "nhari-app-2026"
            keyAlias "nhari"
            keyPassword "nhari-app-2026"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.nhari
        }
        debug {
            signingConfig signingConfigs.nhari
        }
    }

    buildFeatures { buildConfig true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
