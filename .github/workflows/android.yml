name: Android APK

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build the APK (signed when the secret opens the key)
        id: key
        working-directory: android
        env:
          RAW_PASS: ${{ secrets.NHARI_KS_PASS }}
        run: |
          # the password is only letters and digits: drop spaces, line breaks or quotes pasted with it
          clean="$(printf '%s' "$RAW_PASS" | tr -cd 'A-Za-z0-9')"
          echo "secret: ${#RAW_PASS} characters, ${#clean} kept"
          signed=false
          if [ -n "$clean" ]; then
            echo "::add-mask::$clean"
            if NHARI_KS_PASS="$clean" openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in app/nhari.jks.enc -out app/nhari.jks -pass env:NHARI_KS_PASS 2>/dev/null; then
              signed=true
            else
              rm -f app/nhari.jks
              echo "::error::NHARI_KS_PASS does not open the signing key: paste the content of NHARI_KS_PASS.txt again (Update secret)."
            fi
          else
            echo "::warning::Secret NHARI_KS_PASS missing: the code is only compiled, no APK is published."
          fi
          echo "signed=$signed" >> "$GITHUB_OUTPUT"
          if [ "$signed" = true ]; then export NHARI_KS_PASS="$clean"; fi
          gradle --no-daemon assembleRelease -Pvc=${{ github.run_number }}

      - name: Forget the key
        if: always()
        run: rm -f android/app/nhari.jks

      - name: Publish it as the latest release
        if: steps.key.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk nhari.apk
          gh release delete android --yes --cleanup-tag || true
          gh release create android nhari.apk \
            --title "Nhari Android 1.0.${{ github.run_number }}" \
            --notes "Application Android de Nhari (adhan, adhkar, rappels, thumun ×10, boutons dans les notifications, widget). Télécharger nhari.apk sur le téléphone et l'installer." \
            --target "${{ github.sha }}"

      - name: Needs the signing secret
        if: steps.key.outputs.signed != 'true'
        run: |
          echo "::error::No signed APK: the repository secret NHARI_KS_PASS is missing or wrong (Settings > Secrets and variables > Actions)."
          exit 1
